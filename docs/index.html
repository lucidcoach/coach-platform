<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucid Coach</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="brand" id="homeLogo" type="button" aria-label="홈으로 이동">
        <img src="assets/lollogo.png" alt="">
        <div>
          <strong>Lucid Coach</strong>
          <span>Local MVP</span>
        </div>
      </button>
      <nav class="nav" aria-label="main">
        <button class="nav-item active" data-view="market" id="navMarket"></button>
        <button class="nav-item" data-view="bookings" id="navBookings"></button>
        <button class="nav-item" data-view="admin" id="navAdmin"></button>
      </nav>
      <section class="side-coaches" aria-label="코치 목록">
        <span class="label">코치 목록</span>
        <div id="sideCoachList"></div>
      </section>
      <div class="side-panel">
        <span class="label" id="sideLabel"></span>
        <p id="sideCopy"></p>
      </div>
    </aside>

    <main class="main">
      <section class="topbar">
        <div>
          <p class="eyebrow" id="heroEyebrow"></p>
          <h1 id="heroTitle"></h1>
        </div>
        <div class="metrics">
          <div><strong id="metricCoaches">0</strong><span id="metricCoachesLabel"></span></div>
          <div><strong id="metricBookings">0</strong><span id="metricBookingsLabel"></span></div>
          <div><strong id="metricRating">0.0</strong><span id="metricRatingLabel"></span></div>
        </div>
      </section>

      <section class="view active" id="marketView">
        <div class="toolbar">
          <div class="tabs" id="categoryTabs"></div>
          <label class="search">
            <span id="searchLabel"></span>
            <input id="searchInput" type="search">
          </label>
        </div>
        <div class="filter-block">
          <div class="filter-row" id="typeTabs"></div>
          <div class="filter-row" id="segmentTabs"></div>
        </div>
        <section class="featured-section" id="featuredSection">
          <div class="market-head">
            <h2 id="featuredTitle"></h2>
            <span id="featuredHint"></span>
          </div>
          <div class="featured-grid" id="featuredList"></div>
        </section>
        <div class="market-head list-head">
          <h2 id="expertTitle"></h2>
          <span id="expertHint"></span>
        </div>
        <div class="layout">
          <section class="coach-list" id="coachList"></section>
          <section class="detail-panel" id="coachDetail"></section>
        </div>
      </section>

      <section class="view" id="bookingsView">
        <div class="section-head">
          <div>
            <p class="eyebrow" id="bookingEyebrow"></p>
            <h2 id="bookingTitle"></h2>
          </div>
          <button class="secondary" id="clearBookingsBtn"></button>
        </div>
        <div class="booking-tools">
          <select id="bookingStatusFilter"></select>
          <input id="bookingSearchInput" type="search" placeholder="수강생 또는 코치명 검색">
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th id="thStatus"></th>
                <th id="thStudent"></th>
                <th id="thLesson"></th>
                <th id="thTime"></th>
                <th id="thContact"></th>
                <th id="thMemo"></th>
                <th>처리</th>
              </tr>
            </thead>
            <tbody id="bookingRows"></tbody>
          </table>
        </div>
        <section class="booking-detail-panel" id="bookingDetail" hidden></section>
      </section>

      <section class="view" id="adminView">
        <div class="section-head">
          <div>
            <p class="eyebrow" id="adminEyebrow"></p>
            <h2 id="adminTitle"></h2>
          </div>
          <button class="secondary" id="resetCoachesBtn"></button>
        </div>
        <form class="admin-form" id="coachForm">
          <input type="hidden" id="coachId">
          <label><span id="labelCategory"></span>
            <select id="coachCategory">
              <option value="league" id="optLeague"></option>
              <option value="valorant" id="optValorant"></option>
              <option value="academy" id="optAcademy"></option>
            </select>
          </label>
          <label><span id="labelName"></span><input id="coachName" required></label>
          <label><span id="labelTagline"></span><input id="coachTagline" required></label>
          <div class="price-builder">
            <label><span>가격</span><input id="coachPriceAmount" inputmode="numeric" placeholder="예: 70000"></label>
            <label><span>기준</span>
              <select id="coachPriceUnitType">
                <option value="time">시간</option>
                <option value="game">게임</option>
              </select>
            </label>
            <label><span>단위</span>
              <select id="coachPriceUnit"></select>
            </label>
            <input id="coachPrice" type="hidden">
          </div>
          <fieldset class="choice-field">
            <legend id="labelPurpose"></legend>
            <div class="choice-grid" id="coachPurposeChoices"></div>
          </fieldset>
          <fieldset class="choice-field">
            <legend id="labelRoles"></legend>
            <div class="choice-stack" id="coachRoleChoices"></div>
          </fieldset>
          <input id="coachImage" type="hidden">
          <input id="coachFeaturedImage" type="hidden">
          <input id="coachDetailImage" type="hidden">
          <label class="image-position-raw"><span id="labelImagePosition"></span><input id="coachImagePosition" readonly></label>
          <div class="image-upload-grid wide">
            <div class="image-upload-card">
              <label><span>상단 추천 이미지 <small>엠버서더/최우수 노출용 · 권장 1200×675</small></span><input id="coachFeaturedImageFile" type="file" accept="image/*"></label>
              <div class="image-preview banner-preview">
                <div class="image-preview-frame banner" id="coachFeaturedImagePreview"></div>
                <span>추천 상단 카드에 표시</span>
              </div>
              <button type="button" class="secondary image-crop-button" id="openFeaturedCropBtn">상단 추천 이미지 범위 지정</button>
            </div>
            <div class="image-upload-card">
              <label><span>일반 목록 이미지 <small>목록 카드용 · 권장 520×520</small></span><input id="coachImageFile" type="file" accept="image/*"></label>
              <div class="image-preview thumbnail-preview">
                <div class="image-preview-frame" id="coachImagePreview"></div>
                <span>상품 목록 카드에 표시</span>
              </div>
              <button type="button" class="secondary image-crop-button" id="openCropBtn">일반 목록 이미지 범위 지정</button>
            </div>
            <div class="image-upload-card">
              <label><span>상세 설명 이미지 <small>상세 패널용 · 권장 1200×675</small></span><input id="coachDetailImageFile" type="file" accept="image/*"></label>
              <div class="image-preview banner-preview">
                <div class="image-preview-frame banner" id="coachDetailImagePreview"></div>
                <span>오른쪽 상세 화면에 표시</span>
              </div>
              <button type="button" class="secondary image-crop-button" id="openDetailCropBtn">상세 설명 이미지 범위 지정</button>
            </div>
          </div>
          <fieldset class="choice-field">
            <legend id="labelBadges"></legend>
            <div class="badge-picker">
              <select id="coachBadgeSelect"></select>
              <button type="button" class="secondary" id="addCoachBadgeBtn">추가</button>
            </div>
            <div class="choice-grid" id="coachBadgeChoices"></div>
          </fieldset>
          <label class="wide"><span id="labelBio"></span><textarea id="coachBio" rows="4"></textarea></label>
          <div class="form-actions">
            <button type="submit" class="primary" id="saveCoachBtn"></button>
            <button type="button" class="secondary" id="newCoachBtn"></button>
            <button type="button" class="danger" id="deleteCoachBtn"></button>
            <span class="save-status" id="coachSaveStatus" aria-live="polite"></span>
          </div>
        </form>
        <div class="admin-list" id="adminCoachList"></div>
      </section>
    </main>
  </div>

  <template id="bookingFormTemplate">
    <form class="booking-form" id="bookingForm">
      <label><span id="bookingStudentLabel"></span><input name="student" required></label>
      <label><span id="bookingContactLabel"></span><input name="contact" required></label>
      <label><span id="bookingTimeLabel"></span><input name="time" required></label>
      <label><span id="bookingMemoLabel"></span><textarea name="memo" rows="3"></textarea></label>
      <button type="submit" class="primary" id="bookingSubmitBtn"></button>
    </form>
  </template>
  <div class="coach-explorer-modal" id="coachExplorerModal" hidden>
    <div class="coach-explorer-dialog" role="dialog" aria-modal="true" aria-labelledby="coachExplorerTitle">
      <button class="crop-close" id="coachExplorerCloseBtn" type="button" aria-label="닫기">×</button>
      <div class="coach-explorer-head">
        <div>
          <span id="coachExplorerMeta"></span>
          <h3 id="coachExplorerTitle">코치 목록</h3>
        </div>
        <label class="coach-explorer-search">
          <span>검색</span>
          <input id="coachExplorerSearch" type="search" placeholder="코치명, 라인, 강의명">
        </label>
      </div>
      <div class="coach-explorer-filters">
        <div id="coachExplorerRoleFilters"></div>
        <div id="coachExplorerTierFilters"></div>
      </div>
      <div class="coach-explorer-grid" id="coachExplorerGrid"></div>
    </div>
  </div>
  <div class="crop-modal" id="cropModal" hidden>
    <div class="crop-dialog">
      <button class="crop-close" id="cropCloseBtn" type="button" aria-label="닫기">×</button>
      <h3 id="cropTitle">이미지 범위 지정</h3>
      <div class="crop-stage">
        <img id="cropImage" alt="">
        <div class="crop-box" id="cropBox"></div>
      </div>
      <div class="crop-controls">
        <label><span>가로</span><input id="cropX" type="range" min="0" max="100" value="50"></label>
        <label><span>세로</span><input id="cropY" type="range" min="0" max="100" value="50"></label>
        <label><span>줌</span><input id="cropSize" type="range" min="18" max="100" value="70"></label>
      </div>
      <button type="button" class="primary" id="applyCropBtn">적용하기</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
